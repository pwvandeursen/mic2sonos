# Created 2026-11-05 21:48 CET — build-apk workflow v2.0 for mic2sonos fork
# Builds a signed APK with a fixed key and publishes it as a GitHub Release (for Obtainium updates).
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 platform (SDK 36) on the preinstalled SDK
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0"

      - name: Restore fixed signing key (stops if the secret is missing)
        env:
          KEY_B64: ${{ secrets.MIC2SONOS_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "Secret MIC2SONOS_KEYSTORE_B64 is missing - add it under Settings > Secrets and variables > Actions"; exit 1; fi
          echo "$KEY_B64" | grep -v '^#' | base64 -d > "$RUNNER_TEMP/mic2sonos.keystore"
          echo "MIC2SONOS_KEYSTORE=$RUNNER_TEMP/mic2sonos.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "mic2sonos-1.0.${{ github.run_number }}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mic2sonos-apk
          path: mic2sonos-1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: mic2sonos 1.0.${{ github.run_number }}
          body: "Automatic build from commit ${{ github.sha }}"
          files: mic2sonos-1.0.${{ github.run_number }}.apk
          make_latest: true
