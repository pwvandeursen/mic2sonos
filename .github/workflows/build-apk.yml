# Created 2026-11-05 21:00 CET — build-apk workflow v1.0 for mic2sonos fork
# Builds an installable APK on GitHub's servers. Run it from the Actions tab → "Build APK" → "Run workflow".
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform (SDK 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mic2sonos-apk
          path: app/build/outputs/apk/debug/*.apk
